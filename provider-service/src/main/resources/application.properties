spring.application.name=provider-service
server.port=8083

# PostgreSQL Setting
spring.datasource.url=jdbc:postgresql://localhost:5432/nexusai_provider
spring.datasource.username=${DB_USERNAME:nexusai}
spring.datasource.password=${DB_PASSWORD:nexusai@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.enabled=true

# Encryption Secret Key 
nexusai.security.encryption-key=NexusAiSuperSecretKey32BytesLong!
